name: Calidad

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          pytest -v
          --cov=services
          --cov=repositories
          --cov=providers
          --cov=utils
          --cov-report=term-missing
          --cov-fail-under=85
      - run: ruff check .
      - run: mypy config database domain providers repositories services ui utils
